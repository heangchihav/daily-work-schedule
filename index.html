<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Work Schedule</title>
    <!-- PWA Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Schedule">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>
    
    <div class="app-container">
        <!-- Unified Header & Current Task -->
        <header class="glass-panel unified-header">
            <div class="header-left">
                <span id="current-day" class="header-day">Loading...</span>
                <span id="current-date" class="header-date">Loading...</span>
            </div>
            <div class="header-center">
                <div class="header-center-row">
                    <span id="current-task-title" class="header-task-title">Checking Schedule...</span>
                    <span id="current-task-time" class="header-task-time"><i class="fa-regular fa-clock"></i> --:-- – --:--</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="task-progress"></div>
                </div>
                <span class="time-remaining" id="time-remaining"></span>
            </div>
            <div class="header-right">
                <span id="current-task-type" class="type-badge">...</span>
                <h1 id="current-time">00:00</h1>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content glass-panel">
            <!-- Tabs Navigation -->
            <nav class="tabs-nav">
                <button class="tab-btn active" data-tab="week-tab"><i class="fa-solid fa-calendar-week"></i> Week Overview</button>
                <button class="tab-btn" data-tab="floating-tab">
                    <i class="fa-solid fa-layer-group"></i> Floating Tasks
                    <span class="notification-dot" id="floating-count">0</span>
                </button>
            </nav>

            <!-- Tab Content: Week Overview -->
            <section id="week-tab" class="tab-content active">
                <div class="calendar-wrapper">
                    <div class="calendar-header" id="calendar-header">
                        <!-- Days of week will be injected here -->
                    </div>
                    <div class="calendar-body">
                        <div class="time-scale" id="time-scale">
                            <!-- Hours 00:00 to 23:00 injected here -->
                        </div>
                        <div class="calendar-grid" id="week-grid">
                            <!-- Week blocks will be injected here via JS -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Tab Content: Floating Tasks -->
            <section id="floating-tab" class="tab-content">
                <div class="floating-header">
                    <h3>Due Today</h3>
                    <p>Tasks assigned specifically to today.</p>
                </div>
                <div class="floating-list" id="floating-today-list">
                    <!-- Today's floating tasks injected here -->
                </div>
                
                <div class="floating-header" style="margin-top: 2rem;">
                    <h3>Other Floating Tasks</h3>
                    <p>Flexible tasks for any day or upcoming days.</p>
                </div>
                <div class="floating-list" id="floating-tasks-list">
                    <!-- Other floating tasks injected here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="data/schedule.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
